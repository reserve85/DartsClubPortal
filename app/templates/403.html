{% load i18n %}<!DOCTYPE html>
<html lang="{{ LANGUAGE_CODE|default:'de' }}">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark light">
    <title>{% translate "No access" %} – {{ site_name|default:'Darts Club Portal' }}</title>
    <style>
        :root { color-scheme: dark light; --bg: #f5f7fb; --card: #fff; --text: #1a2234; --muted: #5b6b82; --border: #dee2e6; }
        @media (prefers-color-scheme: dark) { :root { --bg: #14161f; --card: #1d2130; --text: #e9ecf2; --muted: #9aa5b8; --border: #2c3244; } }
        *, *::before, *::after { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; padding: 16px; box-sizing: border-box; }
        .card { max-width: 420px; width: 100%; background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 28px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,.15); }
        h1 { font-size: 22px; margin: 8px 0 12px; }
        p { color: var(--muted); line-height: 1.5; }
        a { display: inline-block; margin-top: 12px; background: #206bc4; color: #fff; padding: 10px 18px; border-radius: 8px; text-decoration: none; font-weight: 600; }
        .mark { font-size: 40px; }
    </style>
</head>
<body>
<main class="card">
    <div class="mark" aria-hidden="true">&#128274;</div>
    <h1>{% translate "No access" %}</h1>
    <p>{% translate "You are not allowed to open this page. If you think you should, ask an admin of your club." %}</p>
    <a href="{% url 'home' %}">{% translate "To the start page" %}</a>
</main>
</body>
</html>
