{% load django_vite %}<!DOCTYPE html>
<html lang="{{ LANGUAGE_CODE|default:'de' }}">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="color-scheme" content="dark light">
    <title>{{ site_name }}</title>
    {# Colour scheme before the first paint: account choice, else the device setting. #}
    <script>
        (function () {
            var pref = "{{ request.user.preferred_theme|default:'auto' }}";
            var dark = pref === "dark" || (pref !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
            var root = document.documentElement;
            root.setAttribute("data-mantine-color-scheme", dark ? "dark" : "light");
            root.style.backgroundColor = dark ? "#14161f" : "#f5f7fb";
            root.style.colorScheme = dark ? "dark" : "light";
        })();
    </script>
    {% vite_hmr_client %}
    {% vite_asset 'src/main.tsx' %}
</head>
<body>
{% block inertia %}{% endblock %}
</body>
</html>
