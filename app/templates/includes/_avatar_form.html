{% load i18n %}{# Picture upload for one player. Needs: target (Player), next_url #}
<div class="ui-card">
    <h2 class="ui-section-title h5">{% translate "Picture" %}</h2>
    <div class="d-flex align-items-center gap-3 flex-wrap">
        <span class="ui-avatar xl" data-name="{{ target.name }}"></span>
        <form method="post" action="{% url 'avatar_upload' %}" enctype="multipart/form-data" class="d-flex gap-2 flex-wrap align-items-center">
            {% csrf_token %}
            <input type="hidden" name="player" value="{{ target.pk }}">
            <input type="hidden" name="next" value="{{ next_url }}">
            <input class="form-control" type="file" name="avatar" accept="image/*" aria-label="{% translate 'Picture' %}" required>
            <button type="submit" class="btn btn-primary">{% translate "Upload" %}</button>
        </form>
        {% if target.avatar %}
        <form method="post" action="{% url 'avatar_upload' %}">
            {% csrf_token %}
            <input type="hidden" name="player" value="{{ target.pk }}">
            <input type="hidden" name="next" value="{{ next_url }}">
            <button type="submit" name="remove" value="1" class="btn btn-danger">{% translate "Remove picture" %}</button>
        </form>
        {% endif %}
    </div>
    <p class="form-text mb-0 mt-2">{% translate "Shown in every round avatar of the portal (cropped to a square)." %}</p>
</div>
