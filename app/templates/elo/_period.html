{% load i18n %}
{# Period chips + custom range. Needs: period; keeps ?inactive. #}
<nav class="ui-seg mb-2" aria-label="{% translate 'Period' %}">
    <a class="ui-seg-item{% if period.key == 'month' %} active{% endif %}" href="?period=month&amp;inactive={% if include_inactive %}1{% else %}0{% endif %}">{% translate "This month" %}</a>
    <a class="ui-seg-item{% if period.key == 'last_month' %} active{% endif %}" href="?period=last_month&amp;inactive={% if include_inactive %}1{% else %}0{% endif %}">{% translate "Last month" %}</a>
    <a class="ui-seg-item{% if period.key == 'year' %} active{% endif %}" href="?period=year&amp;inactive={% if include_inactive %}1{% else %}0{% endif %}">{% translate "This year" %}</a>
    <a class="ui-seg-item{% if period.key == 'all' %} active{% endif %}" href="?period=all&amp;inactive={% if include_inactive %}1{% else %}0{% endif %}">{% translate "All time" %}</a>
    <a class="ui-seg-item{% if period.key == 'custom' %} active{% endif %}" href="#period-custom" data-bs-toggle="collapse" role="button" aria-controls="period-custom" aria-expanded="{% if period.key == 'custom' %}true{% else %}false{% endif %}">{% translate "Custom" %}</a>
</nav>
<form method="get" id="period-custom" class="collapse{% if period.key == 'custom' %} show{% endif %} mb-2">
    <input type="hidden" name="period" value="custom">
    <input type="hidden" name="inactive" value="{% if include_inactive %}1{% else %}0{% endif %}">
    <div class="d-flex gap-2 align-items-end flex-wrap">
        <div>
            <label class="form-label small mb-1" for="p-from">{% translate "From" %}</label>
            <input id="p-from" type="date" name="from" class="form-control" value="{{ period.from|date:'Y-m-d' }}">
        </div>
        <div>
            <label class="form-label small mb-1" for="p-to">{% translate "To" %}</label>
            <input id="p-to" type="date" name="to" class="form-control" value="{{ period.to|date:'Y-m-d' }}">
        </div>
        <button type="submit" class="btn btn-primary">{% translate "Show" %}</button>
    </div>
</form>
